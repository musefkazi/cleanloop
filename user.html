<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLEANLOOP | User Registration</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            max-width: 520px;
            margin: 50px auto;
        }

        .auth-card {
            padding: 35px;
        }

        .auth-card h1 {
            margin-bottom: 8px;
        }

        .auth-subtitle {
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d7e2df;
            border-radius: 9px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1d806d;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #145c4f;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #0f493f;
        }

        .form-message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">

        <div class="brand-block">
            <div class="brand-logo">♻</div>

            <div>
                <div class="brand-name">CLEANLOOP</div>
                <small>User Portal</small>
            </div>
        </div>

        <nav class="sidebar-nav">

            <a class="nav-link active" href="user.html">
                👤
                <span>User Registration</span>
            </a>

            <a class="nav-link" href="index.html">
                🏠
                <span>Home</span>
            </a>

            <a class="nav-link" href="dashboard.html">
                ⚙️
                <span>Admin Dashboard</span>
            </a>

        </nav>

    </aside>


    <main class="main-panel">

        <header class="topbar">

            <div>
                <div class="project-title">CLEANLOOP</div>
                <small>User Registration</small>
            </div>

            <div class="system-pill">
                ● System Status: ONLINE
            </div>

        </header>


        <div class="auth-container">

            <section class="panel-card auth-card">

                <h1>Create User Profile</h1>

                <p class="auth-subtitle">
                    Register to request waste collection through CLEANLOOP.
                </p>


                <form id="registrationForm">

                    <div class="form-group">

                        <label for="userName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="userName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="userMobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="userMobile"
                            placeholder="Enter 10-digit mobile number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="userPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="userPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="userAddress">
                            Address
                        </label>

                        <input
                            type="text"
                            id="userAddress"
                            placeholder="Enter your address"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="register-btn">
                        Create Profile
                    </button>

                </form>


                <div
                    id="registrationMessage"
                    class="form-message">
                </div>


                <div class="login-link">

                    Already registered?

                    <a href="user-login.html">
                        Login here
                    </a>

                </div>

            </section>

        </div>

    </main>

</div>


<script>

document.getElementById("registrationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
        document.getElementById("userName").value.trim();

    const mobile =
        document.getElementById("userMobile").value.trim();

    const password =
        document.getElementById("userPassword").value;

    const address =
        document.getElementById("userAddress").value.trim();


    if (mobile.length !== 10 || isNaN(mobile)) {

        document.getElementById("registrationMessage")
        .textContent =
        "Please enter a valid 10-digit mobile number.";

        return;
    }


    const user = {

        name: name,

        mobile: mobile,

        password: password,

        address: address,

        createdAt: new Date().toISOString()

    };


    localStorage.setItem(
        "cleanloop-user",
        JSON.stringify(user)
    );


    document.getElementById("registrationMessage")
    .textContent =
    "✓ Profile created successfully!";


    document.getElementById("registrationForm")
    .reset();

});

</script>

</body>
</html>
