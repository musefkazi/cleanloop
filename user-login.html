<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLEANLOOP | User Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            max-width: 480px;
            margin: 60px auto;
        }

        .auth-card {
            padding: 35px;
        }

        .auth-card h1 {
            margin-bottom: 8px;
        }

        .auth-subtitle {
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d7e2df;
            border-radius: 9px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #145c4f;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0f493f;
        }

        .login-message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand-block">

            <div class="brand-logo">
                ♻
            </div>

            <div>
                <div class="brand-name">
                    CLEANLOOP
                </div>

                <small>
                    User Portal
                </small>
            </div>

        </div>


        <nav class="sidebar-nav">

            <a class="nav-link active" href="user-login.html">
                🔐
                <span>User Login</span>
            </a>

            <a class="nav-link" href="user.html">
                👤
                <span>Create Profile</span>
            </a>

            <a class="nav-link" href="index.html">
                🏠
                <span>Home</span>
            </a>

        </nav>

    </aside>


    <!-- MAIN -->
    <main class="main-panel">

        <header class="topbar">

            <div>
                <div class="project-title">
                    CLEANLOOP
                </div>

                <small>
                    User Login
                </small>
            </div>

            <div class="system-pill">
                ● System Status: ONLINE
            </div>

        </header>


        <div class="auth-container">

            <section class="panel-card auth-card">

                <h1>
                    Welcome Back 👋
                </h1>

                <p class="auth-subtitle">
                    Login to request and track your waste collection.
                </p>


                <form id="loginForm">

                    <!-- MOBILE -->

                    <div class="form-group">

                        <label for="loginMobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="loginMobile"
                            maxlength="10"
                            placeholder="Enter your mobile number"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-btn">

                        Login

                    </button>

                </form>


                <div
                    id="loginMessage"
                    class="login-message">
                </div>


                <div class="register-link">

                    Don't have an account?

                    <a href="user.html">
                        Create Profile
                    </a>

                </div>

            </section>

        </div>

    </main>

</div>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const mobile =
        document.getElementById("loginMobile")
        .value.trim();


    const password =
        document.getElementById("loginPassword")
        .value;


    const savedUser =
        localStorage.getItem("cleanloop-user");


    const message =
        document.getElementById("loginMessage");


    if (!savedUser) {

        message.textContent =
            "No account found. Please create a profile first.";

        return;

    }


    const user =
        JSON.parse(savedUser);


    if (
        mobile === user.mobile &&
        password === user.password
    ) {

        localStorage.setItem(
            "cleanloop-logged-in",
            "true"
        );


        localStorage.setItem(
            "cleanloop-current-user",
            JSON.stringify(user)
        );


        message.textContent =
            "✓ Login successful!";


        setTimeout(function() {

            window.location.href =
                "user-dashboard.html";

        }, 800);


    } else {

        message.textContent =
            "❌ Incorrect mobile number or password.";

    }

});

</script>

</body>

</html>
